 description = "A basic metadata model implementation"

 apply plugin: 'com.gradleup.shadow'

 shadowJar {
   archiveBaseName.set('bmm')
   archiveClassifier.set('')
   archiveVersion.set(project.version)

   // Only pull in these specific submodules — compiled classes and resources
   from(project(":base").sourceSets["main"].output)
   from(project(":bmm").sourceSets["main"].output)
   from(project(":i18n").sourceSets["main"].output)
   from(project(":odin").sourceSets["main"].output)
   from(project(":utils").sourceSets["main"].output)


   // Block *all* dependencies (external and internal)
   dependencies {
     exclude(dependency ('.*:.*:.*'))
   }
 }

 dependencies {
   api project(':base')
   api project(':utils')
   api project(':odin')
   testImplementation project(':i18n')
 }